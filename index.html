<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">

  <!-- IMPORTANT FOR iPhone / Safari NOTCH + ADDRESS BAR -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#680C11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>D&M திருமண அழைப்பிதழ் | R. தினேஷ் & P. மகாலட்சுமி</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Arima:wght@600;700;800&family=Noto+Serif+Tamil:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --red: #A81B23;
      --deep-red: #680C11;
      --dark-red: #3D070A;

      --gold: #D4AF37;
      --gold-light: #F9E79F;
      --gold-pale: #FFF4C7;

      --cream: #FFF9EF;
      --paper: #FDFBF7;
      --white: #FFFFFF;

      --text: #2C1810;
      --muted: #6B4C3B;

      --page-radius: 20px;
      --turn-speed: .85s;
    }


    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100%;

      margin: 0;

      font-family: "Noto Serif Tamil", serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 10%,
          #73151c 0%,
          #3A080C 38%,
          #150204 75%,
          #080001 100%
        );

      overflow-x: hidden;
      overflow-y: auto;

      -webkit-text-size-adjust: 100%;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
    }


    /* =========================================================
       APP SHELL
       
       IMPORTANT:
       NO fixed 100vh.
       NO body overflow:hidden.
       
       This allows desktop and mobile content to grow naturally.
    ========================================================= */

    .app {
      width: 100%;
      max-width: 560px;

      min-height: 100dvh;

      margin: 0 auto;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(212,175,55,.13),
          transparent 32%
        ),
        var(--paper);

      box-shadow:
        0 0 60px rgba(0,0,0,.65);

      position: relative;

      overflow: visible;
    }


    /* =========================================================
       SAFE AREA
       
       iPhone notch / Dynamic Island / status area
    ========================================================= */

    .safe-header {
      padding-top:
        max(
          10px,
          env(safe-area-inset-top)
        );

      padding-left:
        max(
          12px,
          env(safe-area-inset-left)
        );

      padding-right:
        max(
          12px,
          env(safe-area-inset-right)
        );
    }


    /* =========================================================
       TOP HEADER
    ========================================================= */

    .top-header {

      min-height: 64px;

      display: grid;

      grid-template-columns: 44px 1fr 44px;

      align-items: center;

      gap: 8px;

      padding-bottom: 10px;

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--deep-red)
        );

      color: white;

      border-bottom:
        2px solid var(--gold);

      box-shadow:
        0 5px 18px rgba(0,0,0,.3);

      position: relative;

      z-index: 100;
    }

    .header-title {

      font-family: "Arima", serif;

      font-size: 1.02rem;

      font-weight: 800;

      color: var(--gold-light);

      text-align: center;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .header-btn {

      width: 40px;
      height: 40px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      background:
        rgba(255,255,255,.12);

      border:
        1px solid rgba(249,231,159,.7);

      cursor: pointer;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .header-btn:active {
      transform: scale(.92);
    }

    .music-btn.playing {
      background: var(--gold);
      color: var(--red);

      animation:
        musicPulse 1.5s infinite;
    }

    @keyframes musicPulse {
      50% {
        transform: scale(1.08);
      }
    }


    /* =========================================================
       TAB NAVIGATION
    ========================================================= */

    .tabs {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 4px;

      padding:
        6px
        max(6px, env(safe-area-inset-left))
        6px
        max(6px, env(safe-area-inset-right));

      background:
        linear-gradient(
          180deg,
          #F4EEE2,
          #E8DECD
        );

      border-bottom:
        1px solid var(--gold);

      position: sticky;

      top: 0;

      z-index: 90;
    }

    .tab {

      min-width: 0;

      padding: 9px 3px;

      border-radius: 11px;

      background: transparent;

      color: var(--muted);

      font-size: .74rem;

      font-weight: 800;

      cursor: pointer;

      white-space: nowrap;

      transition:
        .3s ease;
    }

    .tab.active {

      color: var(--gold-light);

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--deep-red)
        );

      box-shadow:
        0 4px 12px
        rgba(104,12,17,.3);
    }


    /* =========================================================
       BOOK / PAGE AREA
    ========================================================= */

    .book-area {

      width: 100%;

      padding:
        18px
        max(14px, env(safe-area-inset-right))
        50px
        max(14px, env(safe-area-inset-left));

      perspective: 1800px;

      position: relative;

      touch-action: pan-y;

      overflow: visible;
    }

    /*
      JS changes this height to the current page's content height.
      Therefore desktop can scroll naturally.
    */

    .book {

      width: 100%;

      position: relative;

      transform-style: preserve-3d;

      min-height:
        calc(100dvh - 150px);

      transition:
        height .35s ease;
    }


    /* =========================================================
       INDIVIDUAL PAPER
    ========================================================= */

    .page {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      min-height:
        calc(100dvh - 150px);

      padding:
        18px
        14px
        70px;

      background:
        linear-gradient(
          145deg,
          #FFFFFF,
          #FFF9EF
        );

      border:
        1.5px solid
        rgba(212,175,55,.75);

      border-radius:
        var(--page-radius);

      box-shadow:
        0 15px 35px
        rgba(75,20,10,.13),

        inset
        0 0 30px
        rgba(212,175,55,.04);

      transform-origin:
        left center;

      transform-style:
        preserve-3d;

      backface-visibility:
        hidden;

      -webkit-backface-visibility:
        hidden;

      transition:
        transform
        var(--turn-speed)
        cubic-bezier(
          .645,
          .045,
          .355,
          1
        );

      overflow: visible;

      text-align: center;

      /*
        Important:
        content itself is NOT a fixed-height scroll box.
        Body/document handles scrolling.
      */

      z-index: 1;
    }

    .page.flipping {
      z-index: 100 !important;
    }

    .page.flipped {
      transform:
        rotateY(-180deg);
    }


    /* =========================================================
       PAPER SPINE / EDGE
    ========================================================= */

    .page::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 25px;
      height: 100%;

      border-radius:
        var(--page-radius)
        0
        0
        var(--page-radius);

      background:
        linear-gradient(
          90deg,
          rgba(60,10,10,.13),
          rgba(212,175,55,.04),
          transparent
        );

      pointer-events: none;

      z-index: 2;
    }

    .page::after {

      content: "";

      position: absolute;

      right: 8px;
      top: 8px;
      bottom: 8px;

      width: 2px;

      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(212,175,55,.45),
          transparent
        );

      pointer-events: none;
    }


    /* =========================================================
       DECORATIVE CIRCLE
    ========================================================= */

    .page-decoration {

      position: absolute;

      width: 270px;
      height: 270px;

      border-radius: 50%;

      border:
        1px solid
        rgba(212,175,55,.16);

      top: 15px;

      left: 50%;

      transform:
        translateX(-50%);

      pointer-events: none;
    }

    .page-decoration.small {

      width: 190px;
      height: 190px;

      top: 55px;

      border-style: dashed;

      border-color:
        rgba(168,27,35,.12);
    }


    /* =========================================================
       COMMON CONTENT
    ========================================================= */

    .content {

      width: 100%;

      position: relative;

      z-index: 10;
    }

    .section-title {

      font-family: "Arima", serif;

      color: var(--red);

      font-size: 1.55rem;

      font-weight: 800;

      margin-bottom: 18px;
    }

    .section-title::before {

      content: "✦";

      color: var(--gold);

      font-size: .8rem;

      margin-right: 7px;
    }

    .section-title::after {

      content: "";

      display: block;

      width: 70px;

      height: 2px;

      margin:
        7px auto 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
    }


    /* =========================================================
       HOME / MURUGAN
    ========================================================= */

    .murugan-frame {

      width: 94px;
      height: 94px;

      margin:
        0 auto
        14px;

      padding: 4px;

      border:
        3px solid
        var(--gold);

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          white,
          var(--gold-pale)
        );

      box-shadow:
        0 7px 22px
        rgba(168,27,35,.18);

      overflow: hidden;
    }

    .murugan-frame img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;

      display: block;
    }


    .main-card {

      width: 100%;

      padding:
        23px
        16px
        20px;

      border:
        2px solid
        var(--gold);

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.98),
          rgba(255,249,239,.98)
        );

      box-shadow:
        0 15px 35px
        rgba(74,20,10,.1);
    }

    .invite-small {

      font-size: .84rem;

      color: var(--muted);

      font-weight: 700;

      margin-bottom: 8px;
    }

    .invite-title {

      font-family: "Arima", serif;

      font-size: 1.7rem;

      color: var(--red);

      font-weight: 800;

      margin-bottom: 6px;
    }

    .invite-sub {

      font-size: .88rem;

      color: var(--muted);

      margin-bottom: 14px;
    }

    .couple-name {

      font-family: "Arima", serif;

      font-size: 1.5rem;

      line-height: 1.6;

      font-weight: 800;

      color: var(--text);
    }

    .couple-symbol {

      color: var(--gold);

      font-size: 1.3rem;

      margin:
        4px 0;
    }


    /* =========================================================
       COUNTDOWN
    ========================================================= */

    .countdown {

      width: 100%;

      margin-top: 16px;

      padding: 13px;

      border:
        1.5px solid
        var(--gold);

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #FFFDF5,
          #F8EDDB
        );
    }

    .countdown-title {

      color: var(--muted);

      font-size: .78rem;

      font-weight: 800;

      margin-bottom: 7px;
    }

    .countdown-grid {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 5px;
    }

    .time-box {

      padding: 7px 2px;

      border-radius: 10px;

      background:
        rgba(168,27,35,.05);
    }

    .time-number {

      font-family: "Arima", serif;

      color: var(--red);

      font-size: 1.25rem;

      font-weight: 800;
    }

    .time-label {

      color: var(--muted);

      font-size: .62rem;

      font-weight: 700;
    }


    /* =========================================================
       PERSON CARDS
    ========================================================= */

    .person-card {

      width: 100%;

      padding:
        20px
        17px;

      margin-bottom: 16px;

      border:
        1.5px solid
        var(--gold);

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          white,
          #FFF9EF
        );

      box-shadow:
        0 9px 24px
        rgba(0,0,0,.07);

      position: relative;

      z-index: 10;

      overflow: hidden;
    }

    .person-card::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 5px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold),
          var(--red),
          var(--gold),
          transparent
        );
    }

    .person-label {

      display: inline-block;

      padding:
        5px
        15px;

      margin-bottom: 10px;

      border-radius: 20px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--deep-red)
        );

      font-size: .75rem;

      font-weight: 800;
    }

    .bride-label {

      background:
        linear-gradient(
          135deg,
          #E67E22,
          var(--red)
        );
    }

    .person-name {

      font-family: "Arima", serif;

      font-size: 1.5rem;

      font-weight: 800;

      line-height: 1.45;

      color: var(--text);
    }

    .family {

      margin-top: 10px;

      padding-top: 10px;

      border-top:
        1px dashed
        #DDCDA9;

      font-size: .93rem;

      font-weight: 700;

      line-height: 1.9;
    }


    /* =========================================================
       FLOWER SHOWER
    ========================================================= */

    .flower-canvas {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 6;
    }


    /* =========================================================
       EVENTS
    ========================================================= */

    .event-card {

      width: 100%;

      padding: 20px 17px;

      margin-bottom: 16px;

      text-align: left;

      border:
        1.5px solid
        var(--gold);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          white,
          #FFF9EF
        );

      box-shadow:
        0 8px 22px
        rgba(0,0,0,.06);

      position: relative;

      z-index: 10;

      overflow: hidden;
    }

    .event-card::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 5px;
      height: 100%;

      background:
        linear-gradient(
          180deg,
          var(--red),
          var(--gold)
        );
    }

    .event-date {

      display: inline-block;

      padding:
        7px
        13px;

      border-radius: 11px;

      color: var(--gold-light);

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--deep-red)
        );

      font-size: .9rem;

      font-weight: 800;

      margin-bottom: 12px;
    }

    .event-card.reception .event-date {

      background:
        linear-gradient(
          135deg,
          #E67E22,
          var(--red)
        );
    }

    .event-row {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

      padding: 8px 0;

      border-bottom:
        1px dashed
        #EADFC8;

      font-size: .88rem;

      font-weight: 700;
    }

    .event-row:last-child {
      border-bottom: 0;
    }

    .event-row strong {

      color: var(--red);

      white-space: nowrap;
    }


    /* =========================================================
       QUOTE
    ========================================================= */

    .quote-card {

      width: 100%;

      margin-top: 4px;

      padding: 17px;

      border:
        1.5px solid
        var(--gold);

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #FFFCF5,
          #FFF6E4
        );

      position: relative;

      z-index: 10;
    }

    .quote-title {

      color: var(--red);

      font-size: .9rem;

      font-weight: 800;

      margin-bottom: 8px;
    }

    .quote-text {

      color: var(--text);

      font-size: .84rem;

      line-height: 1.9;

      font-weight: 700;
    }


    /* =========================================================
       VENUE
    ========================================================= */

    .venue-card {

      width: 100%;

      padding:
        24px
        17px;

      border:
        2px solid
        var(--gold);

      border-radius: 23px;

      background:
        linear-gradient(
          145deg,
          white,
          #FFF9EF
        );

      box-shadow:
        0 10px 28px
        rgba(0,0,0,.07);

      position: relative;

      z-index: 10;
    }

    .venue-icon {

      font-size: 2rem;

      margin-bottom: 7px;
    }

    .venue-heading {

      font-family: "Arima", serif;

      font-size: 1.4rem;

      color: var(--red);

      font-weight: 800;

      margin-bottom: 7px;
    }

    .venue-name {

      font-size: 1.12rem;

      font-weight: 800;

      margin-bottom: 10px;
    }

    .venue-address {

      color: var(--muted);

      font-size: .9rem;

      line-height: 1.8;

      margin-bottom: 17px;

      font-weight: 600;
    }

    .map-button {

      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      padding: 14px;

      border-radius: 14px;

      border:
        1.5px solid
        var(--gold);

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--deep-red)
        );

      color: var(--gold-light);

      text-decoration: none;

      font-weight: 800;

      box-shadow:
        0 5px 14px
        rgba(168,27,35,.28);

      transition:
        transform .2s ease;
    }

    .map-button:active {
      transform: scale(.97);
    }


    /* =========================================================
       BOTTOM PAGE CONTROLS
    ==============================================
